# check_adjustment findings waiting on an owner decision.
#
# A finding that matches its entry reads `pending` (a split: `pending_split_jump`)
# and does not fail `check_adjustment.py` (or the check-adjustment-daily schedule)
# until `review_by`. After that date it fails again. Remove an entry once
# the owner's decision has been carried out.
#
# Matching:
#   label finding: same `verdict`, and `drift` (or `level` for level_mismatch)
#                  within 0.005 or 10% of itself, as for `known_adjustment`.
#   split jump:    every open jump date of the file is in `split_dates`.
#
# - file_path: price-data/stocks/ibkr/sp500/XYZ/XYZ-all-1d.parquet
#   split_dates: ["2004-05-25"]
#   reason: "IBKR jump to flag once the workers run the annotation-keeping code"
#   asked: "2026-11-13"
#   review_by: "2026-11-27"
#   ref: "Product msg_..."
#
# An entry with an `action` (and no verdict or split_dates) is an action record:
# repair work whose finding the audit no longer sees, because the range is
# flagged `bad` in data_flags. Past its `review_by` it fails the run itself.
# `waits_on` names the event the work waits for (ibkr_restart: the owner brings
# up the Gateway and restarts the IBKR workers); review_by is the backstop.
- file_path: price-data/stocks/ibkr/sp500/APO/APO-all-1d.parquet
  action: 're-fetch the range from IBKR (2020-01-09..2021-12-31, flagged bad); if IBKR still serves bad bars, delete_stock_bars.py with a recorded gap; py-qwant pre-notice first'
  waits_on: ibkr_restart
  asked: '2026-11-13'
  review_by: '2026-12-11'
  ref: Product msg_d3d90042
