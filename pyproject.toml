[project]
name = "ai-data-manager"
version = "0.1.0"
description = "Price data management across asset classes and providers"
requires-python = ">=3.12"
dependencies = [
    "ccxt>=4.5.58",
    "ibapi>=9.81.1.post1",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "pyyaml>=6.0.3",
    "requests>=2.32.0",
    "yfinance>=0.2.40",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
